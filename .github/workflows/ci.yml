name: CI

# ARCHITECTURE §14. Every run: check → test → build. A push to main then deploys staging; a `v*` tag (or a manual
# run on main) deploys prod. Each deploy migrates its D1 first, so migrations must work with the Worker already live.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push replaces an unfinished PR run, but never stops a deploy halfway (between migrate and deploy).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # No git hooks on CI (skips the `prepare` script's hook install).
  VP_GIT_HOOKS: "0"

jobs:
  check:
    name: check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs vp (version from the pnpm catalog), Node from .node-version, then `vp install`,
      # whose postinstall runs `wrangler types` so the Worker's `Env` types exist for the type check.
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .node-version
          cache: true

      - run: vp check
      - run: vp test
      - run: vp run -r build

  staging:
    name: deploy staging
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.wordless.one
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .node-version
          cache: true

      - run: pnpm --filter site db:migrate:staging
      # Through pnpm, outside the Vite+ task runner and its cache, so CLOUDFLARE_ENV always reaches the build.
      - run: pnpm --filter site build
        env:
          CLOUDFLARE_ENV: staging
      # Uses the config the build generated (staging, from CLOUDFLARE_ENV above).
      - run: pnpm --filter site exec wrangler deploy
      - name: Wait for staging.wordless.one
        # A new custom domain needs a moment for its certificate. Up to 5 minutes.
        run: for i in $(seq 60); do curl -fsS -o /dev/null https://staging.wordless.one/ && exit 0; sleep 5; done; exit 1
      # Read only: the smoke test seeds data only on localhost.
      - run: pnpm smoke --url https://staging.wordless.one

  production:
    name: deploy production
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://wordless.one
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .node-version
          cache: true

      - run: pnpm --filter site db:migrate:prod
      - run: pnpm --filter site build
      - run: pnpm --filter site exec wrangler deploy
      - name: Wait for wordless.one
        # A new custom domain needs a moment for its certificate. Up to 5 minutes.
        run: for i in $(seq 60); do curl -fsS -o /dev/null https://wordless.one/ && exit 0; sleep 5; done; exit 1
      - run: pnpm smoke --url https://wordless.one
