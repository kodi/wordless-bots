packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  "@cloudflare/vite-plugin": ^1.63.1
  "@cloudflare/vitest-plugin": ^1.4.0
  "@tanstack/react-router": ^1.170.42
  "@types/node": ^24
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.1.2
  drizzle-kit: 0.31.11
  drizzle-orm: ^0.45.4
  hono: ^4.13.13
  react: ^19.3.0
  react-dom: ^19.3.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
  wrangler: ^4.149.0
  zod: ^4.6.5
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  esbuild: true
  workerd: true
